<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1e1d" />
    <meta
      name="description"
      content="Indian School Muladha — a CBSE-affiliated, English-medium co-educational school in Al Muladha, Sultanate of Oman. Founded 1981."
    />
    <!-- No webfont request here by design: every face is self-hosted via
         Fontsource, imported at the top of src/index.css. -->
    <title>Indian School Muladha</title>
      <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('isml-theme-v2') === 'studio' ? 'studio' : 'cinema';
      } catch (e) {
        document.documentElement.dataset.theme = 'cinema';
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
