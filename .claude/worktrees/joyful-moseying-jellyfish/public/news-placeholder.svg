<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ISML news and events</title>
  <desc id="desc">A dark blue editorial placeholder image for news and events.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2f6b"/>
      <stop offset="1" stop-color="#2570eb"/>
    </linearGradient>
    <pattern id="lines" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V48" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#ground)"/>
  <rect width="1600" height="900" fill="url(#lines)"/>
  <path d="M110 720H1490" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
  <text x="110" y="210" fill="#fff" fill-opacity=".72" font-family="Arial, sans-serif" font-size="34" letter-spacing="8">INDIAN SCHOOL MULADHA</text>
  <text x="110" y="610" fill="#fff" font-family="Georgia, serif" font-size="142" font-weight="700">News &amp; Events</text>
  <text x="110" y="790" fill="#fff" fill-opacity=".7" font-family="Arial, sans-serif" font-size="28" letter-spacing="4">CAMPUS JOURNAL</text>
</svg>
